[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recon3d"
version = "0.2.0"
description = "Single-view 3D reconstruction: silhouette -> ResNet-18 -> 2,048-point cloud"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Punith B" }]
license = { text = "MIT" }
keywords = ["3d-reconstruction", "point-cloud", "single-view", "shapenet", "pytorch"]
# torch is NOT pinned: Kaggle, Spaces and your laptop each ship their own CUDA/CPU build.
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]
hub = ["huggingface_hub>=0.25", "safetensors>=0.4"]
serve = ["fastapi>=0.110", "uvicorn>=0.29", "gradio>=5.0", "python-multipart>=0.0.9", "plotly>=5.0",
         "prometheus-client>=0.20"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "matplotlib>=3.7", "httpx>=0.27",
       "recon3d[hub,serve]"]

[project.scripts]
recon3d = "recon3d.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: trains a tiny model end to end (still < 1 min on CPU)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]   # launcher notebooks favour readability over lint rules

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "B008"]   # B008: FastAPI declares File()/Query() in argument defaults by design

[tool.ruff.lint.per-file-ignores]
"space/app.py" = ["I001", "E402"]   # `spaces` must be imported before anything that loads torch
